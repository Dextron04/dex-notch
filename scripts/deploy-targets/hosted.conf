# Hosted service (vault.dextron04.in). Run by root from a LaunchDaemon; tests run as _dexhosted.
# key=value, one per line. @UID@ and @HOME@ are replaced. Never sourced or eval'd.
name=hosted
repo=Dextron04/dex-notch
branch=master
ci_job=test
label=in.dextron04.agentvault-hosted
domain=system
base=/var/dexhosted
base_suffix=dexhosted
run_user=_dexhosted
release_owner=root:wheel
src_subdir=memory/agentvault
test_dir=memory
keep=5
health=GET http://127.0.0.1:8766/healthz 200
health=POST http://127.0.0.1:8766/mcp 401
health_timeout=30
test_timeout=900
# notify=osascript         (macOS notification on rollback or rejection; or notify=/path/to/command, called as: command "message")
