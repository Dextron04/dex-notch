# Personal connector (memory.dextron04.in). Run by mac-agent from a LaunchAgent, or by the connector's /hooks/deploy webhook.
# key=value, one per line. @UID@ and @HOME@ are replaced. Never sourced or eval'd.
name=personal
repo=Dextron04/dex-notch
branch=master
ci_job=test
label=in.dextron04.agentvault-remote
domain=gui/@UID@
base=@HOME@/agentvault
base_suffix=agentvault
run_user=mac-agent
# Runs as mac-agent, so Homebrew is fine here (only an executable file is required, no root-ownership check).
python=/opt/homebrew/bin/python3
src_subdir=memory/agentvault
test_dir=memory
keep=5
health=POST http://127.0.0.1:8765/mcp 401
health_timeout=30
test_timeout=900
# notify=osascript
