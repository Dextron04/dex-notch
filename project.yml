name: NotchApp
options:
  bundleIdPrefix: com.tushin
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1       # pinned: the newest releases target a newer Xcode than the CI runner's
schemes:
  NotchApp:
    build:
      targets:
        NotchApp: all
    run:
      config: Debug
    test:
      targets: [NotchAppTests]
targets:
  NotchAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchAppTests, NotchApp/Outlook.swift, NotchApp/Changelog.swift, NotchApp/Reminders.swift, NotchApp/VaultReader.swift, NotchApp/AgentStream.swift, NotchApp/ConversationStore.swift, NotchApp/Journal.swift, NotchApp/Settings.swift, NotchApp/Account.swift, NotchApp/ConnectionLogic.swift, NotchApp/RecorderLogic.swift, NotchApp/AgentFiles.swift, NotchApp/SVGPath.swift, NotchApp/OfficialMarks.swift, NotchApp/KeychainStore.swift, NotchApp/Addons.swift, NotchApp/Gmail.swift, NotchApp/MailReply.swift, NotchApp/ScreenMarks.swift, NotchApp/ScreenTool.swift, NotchApp/DualJudge.swift] # these have no UI deps, so tests compile it directly (no app host needed)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tushin.NotchAppTests
        CODE_SIGN_STYLE: Automatic
  NotchApp:
    type: application
    platform: macOS
    sources:
      - path: NotchApp
        excludes: ["**/.claude-flow/**", "**/.swarm/**", "**/.superpowers/**", "**/.DS_Store"]   # tooling folders must never be bundled into the app
    info:
      path: NotchApp/Info.plist
      properties:
        LSUIElement: true # menu-bar/agent app, no dock icon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Dex Notch"
        CFBundleName: "Dex Notch"
        GoogleClientID: "$(GOOGLE_CLIENT_ID)"          # injected by the release build from CI secrets; empty in a plain checkout
        GoogleClientSecret: "$(GOOGLE_CLIENT_SECRET)"
        MicrosoftClientID: "$(MICROSOFT_CLIENT_ID)"    # same idea: the Outlook sign-in, injected by CI; empty in a plain checkout
        SUFeedURL: "$(SPARKLE_FEED_URL)"               # where updates are announced; a release attaches appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"          # updates must be signed by the matching private key (a CI secret)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true                     # download in the background; the app asks before it restarts
        SUVerifyUpdateBeforeExtraction: true
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: Bundle the recorder
        basedOnDependencyAnalysis: false
        script: |
          # the recorder is standard-library Python; the server and connector halves of the package stay out of the app
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/recorder"
          rm -rf "$DEST" && mkdir -p "$DEST"
          rsync -a --exclude hosted --exclude remote --exclude __pycache__ --exclude '*.pyc' --exclude .DS_Store "$SRCROOT/memory/agentvault" "$DEST/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tushin.NotchApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPARKLE_FEED_URL: https://github.com/Dextron04/dex-notch/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_KEY: "vDz5+exfnVj8RSEdxNhw+TcSbtMdef+GMs8x1lVXt3s="      # public half; the private half is the SPARKLE_PRIVATE_KEY CI secret
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the build step above reads the recorder from the repository
        ENABLE_APP_SANDBOX: false # ships unsandboxed on purpose: the app runs the claude and codex tools, reads other apps' logs and Notification Center, and installs a launchd job, none of which a sandbox allows
        CODE_SIGN_STYLE: Automatic
