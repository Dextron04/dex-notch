name: NotchApp
options:
  bundleIdPrefix: com.tushin
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  NotchApp:
    build:
      targets:
        NotchApp: all
    run:
      config: Debug
    test:
      targets: [NotchAppTests]
targets:
  NotchAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchAppTests, NotchApp/VaultReader.swift, NotchApp/AgentStream.swift, NotchApp/ConversationStore.swift, NotchApp/Journal.swift, NotchApp/Settings.swift] # these have no UI deps, so tests compile it directly (no app host needed)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tushin.NotchAppTests
        CODE_SIGN_STYLE: Automatic
  NotchApp:
    type: application
    platform: macOS
    sources: [NotchApp]
    info:
      path: NotchApp/Info.plist
      properties:
        LSUIElement: true # menu-bar/agent app, no dock icon
        CFBundleDisplayName: NotchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tushin.NotchApp
        ENABLE_APP_SANDBOX: false # ponytail: unsandboxed for easy dev; sandbox before shipping
        CODE_SIGN_STYLE: Automatic
