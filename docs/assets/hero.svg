<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="dex-notch: the Mac notch, wired to every AI you use">
<title>dex-notch</title>
<defs>
  <radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#ffb059" stop-opacity=".34"/><stop offset=".45" stop-color="#ee6b2e" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#ffb059" stop-opacity="0"/><stop offset=".5" stop-color="#ffb059" stop-opacity=".7"/><stop offset="1" stop-color="#ffb059" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<style>
  .dot { animation: pulse 2.6s ease-in-out infinite; transform-origin: 506px 27px; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
  .ul { animation: slide 9s cubic-bezier(.3,.7,.2,1) infinite; }
  @keyframes slide { 0%,28% { transform: translateX(96px) } 36%,61% { transform: translateX(188px) } 69%,94% { transform: translateX(0) } 100% { transform: translateX(96px) } }
  .m1 { animation: s1 9s infinite } .m2 { animation: s2 9s infinite } .m3 { animation: s3 9s infinite }
  @keyframes s2 { 0%,30% { stroke:#ffb059 } 36%,94% { stroke:#8d867b } 100% { stroke:#ffb059 } }
  @keyframes s3 { 0%,30% { stroke:#8d867b } 36%,61% { stroke:#ffb059 } 69%,100% { stroke:#8d867b } }
  @keyframes s1 { 0%,64% { stroke:#8d867b } 69%,94% { stroke:#ffb059 } 100% { stroke:#8d867b } }
  @media (prefers-reduced-motion: reduce) { .dot,.ul,.m1,.m2,.m3 { animation: none } .ul { transform: translateX(96px) } .m2 { stroke:#ffb059 } }
</style>
<rect width="1600" height="600" fill="#050404"/>
<rect width="1600" height="600" fill="url(#glow)"/>
<ellipse cx="800" cy="0" rx="430" ry="150" fill="#ffb059" opacity=".22" filter="url(#soft)"/>

