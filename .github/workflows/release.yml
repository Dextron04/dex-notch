name: Release
# Tag a version (git tag v0.1.0 && git push --tags) to publish a DMG.
# Run it by hand from the Actions tab to just build one and download it as an artifact, with no release created.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the DMG
        env:    # the app's own Google sign-in client (a desktop client id/secret is not confidential, but it stays out of git)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}      # the Outlook sign-in (an application ID, not a secret, but it stays out of git)
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}      # signs the update; the matching public key is built into the app
        run: scripts/make-dmg.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: dex-notch-${{ github.ref_name }}
          path: build/dist/*
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # the release page is that version's section of CHANGELOG.md (with its screenshots) plus the install steps
          if scripts/release-notes.sh "$GITHUB_REF_NAME" > build/notes.md; then NOTES=(--notes-file build/notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" build/dist/* --title "Dex Notch $GITHUB_REF_NAME" "${NOTES[@]}"
