name: Release
# Tag a version (git tag v0.1.0 && git push --tags) to publish a DMG.
# Run it by hand from the Actions tab to just build one and download it as an artifact, with no release created.
# Third-party actions are pinned to full commit SHAs (the tag is in the comment); bump them on purpose, not by accident.
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: read }      # least privilege by default; only the publish job below may write
jobs:
  test:      # nothing ships unless both suites pass; no secrets in this job
    runs-on: macos-26   # macos-26: the SpeechAnalyzer dictation engine needs the macOS 26 SDK (older toolchains still compile via #if compiler)
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift tests
        run: |
          set -o pipefail      # a failing test run must fail the job, not just its last 15 lines
          xcodegen generate
          # The tail keeps the log short; on failure, print every error and failed test with its file and line.
          xcodebuild test -scheme NotchApp -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 15 || {
            echo "::group::Build errors and failed tests"
            grep -E "error:|: error|failed \(|with [1-9][0-9]* failures?" "$RUNNER_TEMP/xcodebuild.log" | sort -u
            echo "::endgroup::"
            exit 1
          }
      - name: Python tests (recorder, MCP server, connector)
        working-directory: memory
        run: python3 -m unittest discover -s tests

  dmg:
    needs: test
    runs-on: macos-26
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the DMG
        env:    # the app's own Google sign-in client (a desktop client id/secret is not confidential, but it stays out of git)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}      # the Outlook sign-in (an application ID, not a secret, but it stays out of git)
          SKIP_UPDATE_SIGNING: '1'                                      # signing is the next step: the build never sees the update key
        run: scripts/make-dmg.sh "${GITHUB_REF_NAME}"
      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}      # signs the update; the matching public key is built into the app. Only this step has it.
        run: scripts/sign-update.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dex-notch-${{ github.ref_name }}
          path: build/dist/*
          if-no-files-found: error

  publish:   # the only job that can write to the repository, and it holds no secrets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dmg
    runs-on: macos-15      # same toolchain as before for release-notes.sh
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dex-notch-${{ github.ref_name }}
          path: build/dist
      - name: Publish the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # the release page is that version's section of CHANGELOG.md (with its screenshots) plus the install steps
          if scripts/release-notes.sh "$GITHUB_REF_NAME" > build/notes.md; then NOTES=(--notes-file build/notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" build/dist/* --title "Dex Notch $GITHUB_REF_NAME" "${NOTES[@]}"
