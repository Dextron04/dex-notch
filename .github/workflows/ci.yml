name: CI
on:
  push: { branches: [master] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift tests
        run: |
          set -o pipefail      # a failing test run must fail the job, not just its last 15 lines
          xcodegen generate
          # The tail keeps the log short; on failure, print every error and failed test with its file and line.
          xcodebuild test -scheme NotchApp -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 15 || {
            echo "::group::Build errors and failed tests"
            grep -E "error:|: error|failed \(|with [1-9][0-9]* failures?" "$RUNNER_TEMP/xcodebuild.log" | sort -u
            echo "::endgroup::"
            exit 1
          }
      - name: Python tests (recorder, MCP server, connector)
        working-directory: memory
        run: python3 -m unittest discover -s tests
  # The recorder inside the app promises Python 3.9 or later. Everything except the hosted server (which is not bundled) must pass on 3.9.
  python39:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.9' }
      - name: Recorder tests on Python 3.9
        working-directory: memory
        run: |
          MODS=$( (ls tests/test_*.py | grep -v test_hosted; echo tests/test_hosted_client.py) | sed 's|/|.|; s|\.py$||')
          python -m unittest $MODS
